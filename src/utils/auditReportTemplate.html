<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Audit Report — MistHustlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --card:#1a1a1a;
    --card2:#1f1f1f;
    --line:#2a2a2a;
    --line2:#333;
    --txt:#F5F3F0;
    --muted:#8f8a85;
    --orange:#FC5000;
    --amber:#F59E0B;
    --green:#22C55E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#0a0a0a;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .page{
    width:210mm;height:297mm;
    background:var(--bg);
    position:relative;overflow:hidden;
    margin:0 auto 10mm;
    display:flex;flex-direction:column;
  }
  .pad{padding:16mm 16mm;}
  h1,h2,h3,h4,.display{font-family:'Space Grotesk','Archivo',sans-serif;letter-spacing:-0.03em;font-weight:700;}
  .serif{font-family:'Cormorant Garamond',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* backgrounds */
  .grid-bg{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:14mm 14mm;
  }
  .glow-o{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(252,80,0,.30) 0%,rgba(252,80,0,0) 68%);
    filter:blur(6px);
  }
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 30%,rgba(0,0,0,.65) 100%);}

  .accentline{height:3px;width:100%;background:linear-gradient(90deg,var(--orange) 0%,var(--amber) 45%,rgba(252,80,0,0) 100%);}

  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:8.5pt;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);}
  .eyebrow-o{color:var(--orange);}

  .card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;position:relative;}
  .card.hair{box-shadow:0 10px 30px rgba(0,0,0,.45);}

  .logo{display:flex;align-items:center;gap:9px;}
  .logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(140deg,var(--orange),#7a2400);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:14px;color:#fff;box-shadow:0 0 0 1.5px rgba(252,80,0,.35),0 6px 16px rgba(252,80,0,.28);}
  .logo-txt{font-family:'Space Grotesk';font-weight:700;font-size:12.5pt;letter-spacing:-.02em;}
  .logo-txt span{color:var(--orange);}

  .pagefoot{
    margin-top:auto;padding:0 16mm 10mm;display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:7.5pt;color:#5f5a56;letter-spacing:.14em;text-transform:uppercase;
  }
  .pagefoot .num{color:var(--orange);}

  .chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:8pt;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .chip.o{border-color:rgba(252,80,0,.45);color:#ff8a4d;background:rgba(252,80,0,.08);}
  .chip.g{border-color:rgba(34,197,94,.4);color:#5ee38f;background:rgba(34,197,94,.07);}
  .chip.a{border-color:rgba(245,158,11,.4);color:#f8c465;background:rgba(245,158,11,.07);}

  .numchip{width:22px;height:22px;border-radius:7px;background:rgba(252,80,0,.12);border:1.5px solid rgba(252,80,0,.5);color:var(--orange);
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:9pt;flex:none;}

  .sec-title{font-size:15pt;letter-spacing:-.02em;}
  .lbl{font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-family:'JetBrains Mono',monospace;}

  /* check rows */
  .grp{margin-bottom:5.5mm;}
  .grp-head{display:flex;align-items:center;gap:10px;margin-bottom:2.6mm;}
  .grp-head .bar{flex:1;height:1.5px;background:var(--line);}
  .row{display:flex;align-items:flex-start;gap:9px;padding:2.6mm 3mm;border-radius:9px;background:var(--card);border:1.2px solid var(--line);border-left-width:3px;margin-bottom:1.6mm;}
  .row.fail{border-left-color:var(--orange);background:linear-gradient(90deg,rgba(252,80,0,.07),rgba(26,26,26,.6) 40%);}
  .row.pass{border-left-color:rgba(34,197,94,.75);}
  .ico{width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9pt;font-weight:700;flex:none;margin-top:1px;}
  .ico.p{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.4);}
  .ico.f{background:rgba(252,80,0,.14);color:var(--orange);border:1px solid rgba(252,80,0,.45);}
  .row .lab{font-family:'Space Grotesk';font-weight:600;font-size:9.3pt;line-height:1.2;}
  .row .det{font-size:7.6pt;color:var(--muted);line-height:1.35;margin-top:2px;}
  .wbar{width:34px;height:4px;border-radius:3px;background:#2c2c2c;overflow:hidden;flex:none;}
  .wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));}
  .dots{display:flex;gap:3px;flex:none;}
  .dot{width:4px;height:4px;border-radius:50%;background:#3a3a3a;}
  .dot.on{background:var(--orange);}
  .dot.ong{background:var(--green);}

  table{width:100%;border-collapse:collapse;}
  th{font-family:'JetBrains Mono',monospace;font-size:7pt;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 2.5mm;border-bottom:1.5px solid var(--line2);}
  td{padding:2.6mm 0;border-bottom:1px solid var(--line);font-size:8.4pt;vertical-align:top;}

  @page{size:A4;margin:0;}
  @media print{
    html,body{background:#fff;}
    .page{margin:0;box-shadow:none;break-after:page;page-break-after:always;}
    .page:last-child{break-after:auto;page-break-after:auto;}
    .noprint{display:none!important;}
  }
  @media screen{
    .page{box-shadow:0 24px 70px rgba(0,0,0,.7);}
    body{padding:10mm 0;}
  }
  .toolbar{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;gap:10px;}
  .btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.04em;cursor:pointer;box-shadow:0 10px 30px rgba(252,80,0,.4);}
  .btn.ghost{background:#1f1f1f;color:#ddd;border:1.5px solid #333;box-shadow:none;}
</style>
</head>
<body>

<div class="toolbar noprint">
  <button class="btn ghost" onclick="document.getElementById('jsonBox').style.display=document.getElementById('jsonBox').style.display==='block'?'none':'block'">Edit Data</button>
  <button class="btn" onclick="window.print()">Save as PDF</button>
</div>
<div id="jsonBox" class="noprint" style="display:none;position:fixed;right:18px;bottom:76px;width:430px;height:52vh;z-index:99;background:#151515;border:1.5px solid #333;border-radius:14px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.7)">
  <textarea id="jsonTa" style="width:100%;height:calc(100% - 40px);background:#0e0e0e;color:#d6d3d1;border:1px solid #2a2a2a;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:10px;padding:10px;resize:none"></textarea>
  <button class="btn" style="margin-top:8px;width:100%" onclick="applyJson()">Re-render Report</button>
</div>

<div id="report"></div>

<script>
/* ============== DATA ============== */
const DATA = __AUDIT_DATA__;

/* ============== HELPERS ============== */
const inr = n => "₹" + n.toLocaleString('en-IN');
const inrShort = n => n>=10000000 ? "₹"+(n/10000000).toFixed(2)+" Cr" : n>=100000 ? "₹"+(n/100000).toFixed(2)+" L" : "₹"+(n/1000).toFixed(0)+"K";
const gradeOf = s => s>=75 ? {t:"STRONG",c:"var(--green)",cls:"g"} : s>=50 ? {t:"AVERAGE",c:"var(--amber)",cls:"a"} : {t:"WEAK",c:"var(--orange)",cls:"o"};

function ring(score, size, stroke, showLabel){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-score/100), g=gradeOf(score);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <defs>
      <linearGradient id="rg${size}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FC5000"/><stop offset="55%" stop-color="#FF7A33"/><stop offset="100%" stop-color="#F59E0B"/>
      </linearGradient>
      <filter id="gl${size}"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#242424" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r+stroke/2+5}" fill="none" stroke="#1e1e1e" stroke-width="1"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg${size})" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})" filter="url(#gl${size})"/>
    <text x="50%" y="${showLabel?'48%':'54%'}" text-anchor="middle" dominant-baseline="middle"
      font-family="Space Grotesk" font-weight="700" font-size="${size*0.3}" fill="#F5F3F0">${score}</text>
    ${showLabel?`<text x="50%" y="${size*0.665}" text-anchor="middle" font-family="JetBrains Mono" font-size="${size*0.058}" letter-spacing="${size*0.02}" fill="${g.c}">${g.t}</text>
    <text x="50%" y="${size*0.755}" text-anchor="middle" font-family="JetBrains Mono" font-size="${size*0.045}" letter-spacing="${size*0.016}" fill="#6b6764">SCORE / 100</text>`:''}
  </svg>`;
}

function donut(pct,size,label){
  const stroke=7,r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  const col = pct>=75?'#22C55E':pct>=50?'#F59E0B':'#FC5000';
  return `<div style="text-align:center">
   <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#262626" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-family="Space Grotesk" font-weight="700" font-size="${size*0.27}" fill="#F5F3F0">${pct}<tspan font-size="${size*0.14}">%</tspan></text>
   </svg>
   <div class="lbl" style="margin-top:4px;font-size:6.6pt">${label}</div></div>`;
}

const logo = (big) => `<div class="logo">
  <div class="logo-mark" style="${big?'width:38px;height:38px;font-size:17px;border-radius:10px':''}">M</div>
  <div><div class="logo-txt" style="${big?'font-size:15pt':''}">Mist<span>Hustlers</span></div>
  <div class="mono" style="font-size:5.6pt;letter-spacing:.26em;color:#6b6764;text-transform:uppercase;margin-top:1px">Web Dev · AI Automation</div></div></div>`;

const foot = (n,label) => `<div class="pagefoot"><span>MistHustlers · SEO Audit</span><span>${label}</span><span class="num">${String(n).padStart(2,'0')} / 06</span></div>`;

/* ============== RENDER ============== */
function render(D){
  const g = gradeOf(D.score);
  const fails = D.checks.filter(c=>!c.passed).sort((a,b)=>b.weight-a.weight);
  const groups = ["Content","Technical","Social","Structure"];
  const groupStat = groups.map(gr=>{
    const cs=D.checks.filter(c=>c.group===gr);
    return {gr, pct: Math.round(cs.filter(c=>c.passed).length/cs.length*100), n:cs.length, p:cs.filter(c=>c.passed).length};
  });

  /* ---------- PAGE 1 COVER ---------- */
  const p1 = `
  <div class="page">
    <div class="grid-bg"></div>
    <div class="glow-o" style="width:420px;height:420px;right:-130px;top:-110px"></div>
    <div class="glow-o" style="width:300px;height:300px;left:-110px;bottom:60px;opacity:.6"></div>
    <div class="vignette"></div>
    <div class="accentline" style="position:relative"></div>
    <div class="pad" style="position:relative;display:flex;flex-direction:column;height:100%;padding-bottom:0">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        ${logo(true)}
        <div style="text-align:right">
          <div class="mono" style="font-size:7pt;letter-spacing:.22em;color:#6b6764">REF ${D.refId}</div>
          <div class="mono" style="font-size:7pt;letter-spacing:.22em;color:#6b6764;margin-top:3px">CONFIDENTIAL</div>
        </div>
      </div>

      <div style="margin-top:30mm">
        <div class="eyebrow eyebrow-o">Technical &amp; On-Page Analysis</div>
        <h1 style="font-size:46pt;line-height:.92;margin-top:6mm;letter-spacing:-.045em">SEO<br>AUDIT<br><span style="color:var(--orange)">REPORT</span></h1>
        <div style="width:56mm;height:2px;background:linear-gradient(90deg,var(--orange),transparent);margin:7mm 0 6mm"></div>
        <div class="mono" style="font-size:11pt;color:var(--orange);letter-spacing:-.01em">${D.url}</div>
        <div style="font-size:9pt;color:var(--muted);margin-top:3mm">Prepared for <span style="color:#e8e5e2;font-weight:600">${D.client}</span></div>
      </div>

      <div style="margin-top:auto;margin-bottom:12mm;display:flex;align-items:flex-end;justify-content:space-between;gap:10mm">
        <div class="card hair" style="padding:6mm 7mm;flex:1;background:linear-gradient(150deg,#1c1c1c,#151515)">
          <div class="lbl" style="font-size:6.8pt">Overall Health Grade</div>
          <div class="serif" style="font-size:34pt;line-height:1;margin-top:3mm;color:${g.c};font-weight:600">${g.t.charAt(0)+g.t.slice(1).toLowerCase()}</div>
          <div style="display:flex;gap:5mm;margin-top:5mm;padding-top:4mm;border-top:1px solid var(--line)">
            <div><div class="lbl" style="font-size:6pt">Passed</div><div class="display" style="font-size:13pt;color:var(--green)">${D.passed}<span style="color:#4a4744;font-size:9pt">/${D.total}</span></div></div>
            <div><div class="lbl" style="font-size:6pt">Issues</div><div class="display" style="font-size:13pt;color:var(--orange)">${D.total-D.passed}</div></div>
            <div><div class="lbl" style="font-size:6pt">Date</div><div class="display" style="font-size:10pt;padding-top:2px">${D.reportDate}</div></div>
          </div>
        </div>
        <div style="filter:drop-shadow(0 12px 34px rgba(252,80,0,.28))">${ring(D.score,152,11,true)}</div>
      </div>

      <div style="border-top:1.5px solid var(--line);padding:5mm 0 6mm;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:8pt;color:var(--muted)">Prepared by <span style="color:#fff;font-weight:600">MistHustlers</span> — Indore, India</div>
        <div class="mono" style="font-size:7pt;letter-spacing:.2em;color:#5f5a56">misthustlers.com</div>
      </div>
    </div>
  </div>`;

  /* ---------- PAGE 2 EXEC SUMMARY ---------- */
  const p2 = `
  <div class="page">
    <div class="accentline"></div>
    <div class="pad" style="padding-bottom:6mm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9mm">
        ${logo()}<div class="eyebrow">01 — Executive Summary</div>
      </div>

      <div style="display:flex;gap:9mm;align-items:flex-start">
        <div style="flex:none;text-align:center">
          ${ring(D.score,116,9,false)}
          <div class="chip ${g.cls}" style="margin-top:4mm">${g.t}</div>
          <div class="lbl" style="font-size:6pt;margin-top:3mm;line-height:1.6">Overall<br>SEO Score</div>
        </div>
        <div style="flex:1">
          <h2 style="font-size:22pt;line-height:1.08">Your site is leaking <span style="color:var(--orange)">${D.total-D.passed} critical</span> ranking signals.</h2>
          <p style="font-size:9pt;color:#b3aeaa;line-height:1.6;margin-top:4mm">
            We ran <strong style="color:#fff">${D.total} weighted checks</strong> across content, technical health, social metadata and structured data.
            <strong style="color:var(--green)">${D.passed} passed</strong>, <strong style="color:var(--orange)">${D.total-D.passed} failed</strong>.
            ${D.trafficHint}
          </p>
          <div style="display:flex;gap:3mm;margin-top:5mm">
            ${groupStat.map(s=>`<div class="card" style="flex:1;padding:3.5mm 3mm;text-align:center">
              <div class="display" style="font-size:14pt;color:${s.pct>=75?'var(--green)':s.pct>=50?'var(--amber)':'var(--orange)'}">${s.pct}%</div>
              <div class="lbl" style="font-size:5.8pt;margin-top:1.5mm">${s.gr}</div></div>`).join('')}
          </div>
        </div>
      </div>

      <div class="card hair" style="margin-top:8mm;padding:6mm 7mm;background:linear-gradient(120deg,rgba(252,80,0,.14),#1a1a1a 55%);border-color:rgba(252,80,0,.32);overflow:hidden">
        <div class="glow-o" style="width:220px;height:220px;right:-70px;top:-90px;opacity:.5"></div>
        <div style="position:relative;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="eyebrow eyebrow-o">Estimated Revenue Leak</div>
            <div style="display:flex;align-items:baseline;gap:8mm;margin-top:4mm">
              <div><div class="serif" style="font-size:32pt;line-height:1;color:#fff;font-weight:600">${inr(D.revenueLeak.perMonthInr)}</div>
                <div class="lbl" style="font-size:6.2pt;margin-top:2mm">Per Month</div></div>
              <div style="width:1px;height:20mm;background:var(--line2)"></div>
              <div><div class="serif" style="font-size:32pt;line-height:1;color:var(--orange);font-weight:600">${inr(D.revenueLeak.perYearInr)}</div>
                <div class="lbl" style="font-size:6.2pt;margin-top:2mm">Per Year</div></div>
            </div>
          </div>
          <div style="text-align:right;max-width:52mm">
            <div class="serif" style="font-size:13pt;font-style:italic;color:#cfcac6;line-height:1.35">"Every month unfixed compounds the gap your competitors are closing."</div>
          </div>
        </div>
      </div>

      <div style="margin-top:8mm">
        <div class="grp-head"><div class="sec-title">Priority Fix List</div><div class="bar"></div><div class="lbl" style="font-size:6.4pt">Ranked by weight</div></div>
        ${fails.slice(0,5).map((c,i)=>`
          <div class="card" style="display:flex;gap:4mm;align-items:center;padding:3.4mm 4mm;margin-bottom:2mm;border-left:3px solid var(--orange)">
            <div class="numchip">${i+1}</div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="display" style="font-size:10pt">${c.label}</span>
                <span class="mono" style="font-size:6.4pt;color:#5f5a56">${c.id}</span>
              </div>
              <div style="font-size:7.8pt;color:var(--muted);margin-top:1.5px;line-height:1.35">${c.detail}</div>
            </div>
            <div style="text-align:right;flex:none">
              <div class="display" style="font-size:11pt;color:var(--orange)">${c.weight}</div>
              <div class="lbl" style="font-size:5.4pt">Weight</div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    ${foot(2,'Executive Summary')}
  </div>`;

  /* ---------- PAGE 3 MATRIX ---------- */
  const p3 = `
  <div class="page">
    <div class="accentline"></div>
    <div class="pad" style="padding-bottom:4mm">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6mm">
        ${logo()}<div class="eyebrow">02 — Check Results Matrix</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6mm">
        <div>
          <h2 style="font-size:19pt">All ${D.total} Checks</h2>
          <div style="font-size:8pt;color:var(--muted);margin-top:1.5mm">Grouped by discipline · weight indicates ranking impact</div>
        </div>
        <div style="display:flex;gap:6mm">${groupStat.map(s=>donut(s.pct,42,s.gr)).join('')}</div>
      </div>

      ${groups.map(gr=>{
        const cs=D.checks.filter(c=>c.group===gr);
        const st=groupStat.find(s=>s.gr===gr);
        return `<div class="grp">
          <div class="grp-head">
            <span class="display" style="font-size:10.5pt;letter-spacing:.02em">${gr}</span>
            <span class="mono" style="font-size:6.6pt;color:${st.pct>=50?'var(--green)':'var(--orange)'}">${st.p}/${st.n} PASSED</span>
            <div class="bar"></div>
          </div>
          ${cs.map(c=>`
            <div class="row ${c.passed?'pass':'fail'}">

      <div style="margin-top:auto;width:100%;border-top:1.5px solid var(--line);padding:5mm 0 6mm;display:flex;justify-content:space-between">
