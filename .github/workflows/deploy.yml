name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: bash <(curl -fsSL railway.com/install.sh) -y
      - name: Debug secrets
        run: |
          echo "RAILWAY_TOKEN is set: ${{ secrets.RAILWAY_TOKEN != '' }}"
          echo "RAILWAY_SERVICE_ID is set: ${{ secrets.RAILWAY_SERVICE_ID != '' }}"
      - name: Check Railway CLI
        run: ~/.railway/bin/railway --version
      - name: Auth check
        run: ~/.railway/bin/railway whoami --verbose 2>&1 || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy to Railway
        run: ~/.railway/bin/railway up --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
