<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --onyx:#050308; --deep-orchid:#1a0a2e; --orchid:#a855f7; --orchid-bright:#c084fc;
  --blush:#e3c3bd; --ivory:#f6efe6; --stone:#a89e93;
  --font-heading:'Cormorant Garamond',serif; --font-body:'Jost',sans-serif;
}
html{scroll-behavior:smooth;background:var(--onyx);color:var(--ivory);}
body{background:var(--onyx);font-family:var(--font-body);font-weight:300;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
.bg-onyx{background-color:#050308}
.bg-deep-orchid{background-color:#1a0a2e}
.bg-orchid{background-color:#a855f7}
.text-orchid{color:#a855f7}
.text-orchid-bright{color:#c084fc}
.text-ivory{color:#f6efe6}
.text-stone{color:#a89e93}
.text-onyx{color:#050308}
.border-orchid\/15{border-color:rgba(168,85,247,.15)}
.border-orchid\/20{border-color:rgba(168,85,247,.2)}
.border-orchid\/30{border-color:rgba(168,85,247,.3)}
.border-orchid\/40{border-color:rgba(168,85,247,.4)}
.border-orchid\/60{border-color:rgba(168,85,247,.6)}
.hover\:bg-orchid\/10:hover{background-color:rgba(168,85,247,.1)}
.hover\:text-ivory:hover{color:#f6efe6}
.gilded-glass{background:rgba(168,85,247,.04);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-top:1px solid rgba(168,85,247,.25);border-bottom:1px solid rgba(168,85,247,.1)}
.gilded-glass-strong{background:rgba(168,85,247,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(168,85,247,.35);box-shadow:0 0 30px rgba(168,85,247,.12)}
.orchid-hairline{height:1px;background:linear-gradient(90deg,transparent,rgba(168,85,247,.5),transparent);margin:0 auto}
.font-heading{font-family:var(--font-heading)}.font-body{font-family:var(--font-body)}
.tracking-wide{letter-spacing:.25em}.tracking-body{letter-spacing:.02em}
.corner-bracket{position:relative}.corner-bracket::before{content:'';position:absolute;top:0;left:0;width:24px;height:24px;border-top:1px solid rgba(168,85,247,.5);border-left:1px solid rgba(168,85,247,.5)}.corner-bracket::after{content:'';position:absolute;bottom:0;right:0;width:24px;height:24px;border-bottom:1px solid rgba(168,85,247,.5);border-right:1px solid rgba(168,85,247,.5)}
.scroll-indicator{position:absolute;bottom:32px;left:50%;transform:translateX(-50%)}
.scroll-line{width:1px;height:60px;background:linear-gradient(to bottom,rgba(168,85,247,.8),transparent);margin:0 auto;position:relative}
.scroll-dot{position:absolute;top:0;left:50%;width:6px;height:6px;border-radius:50%;background:var(--orchid);transform:translateX(-50%)}
/* lightbox */
.lightbox-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;cursor:pointer}
.lightbox-overlay img{max-height:90vh;max-width:90vw;object-fit:contain}
.lightbox-close{position:absolute;top:24px;right:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);font-size:24px;font-family:var(--font-body);font-weight:200}
/* before/after divider */
.ba-pair{display:grid;grid-template-columns:1fr 1px 1fr;gap:0;position:relative}
.ba-divider{width:1px;background:rgba(168,85,247,.4)}
/* custom scrollbar */
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--onyx)}::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}
/* reduced motion */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* scroll-reveal animations */
@keyframes scrollBounce {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 1; }
  50% { transform: translateX(-50%) translateY(10px); opacity: 0.4; }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
