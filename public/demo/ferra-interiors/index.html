        addEventListener('wheel', (event) => {
          if (event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
          event.preventDefault();
          const scale = event.deltaMode === 1 ? 18 : event.deltaMode === 2 ? innerHeight : 1;
          target = Math.min(maximum(), Math.max(0, target + event.deltaY * scale));
          if (!frame) {
            current = scrollY;
            frame = requestAnimationFrame(animate);
          }
        }, { passive: false });
        addEventListener('resize', () => { target = Math.min(target, maximum()); });
        addEventListener('keydown', () => { current = target = scrollY; });
        document.addEventListener('click', (event) => {
          if (event.target.closest('a[href^="#"]')) requestAnimationFrame(() => { current = target = scrollY; });
        });
      })();
    </script>
  </body>
</html>
