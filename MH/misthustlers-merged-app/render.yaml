services:
  - type: web
    name: misthustlers
    env: node
    region: oregon
    buildCommand: bash render-build.sh
    startCommand: cd backend && npx prisma migrate deploy && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: misthustlers-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: misthustlers2026
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: misthustlers-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
