[build]
  command = "npm ci && npx playwright install chromium && npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/fetch-audit-html"
  to = "/.netlify/functions/fetch-audit-html"
  status = 200

[[redirects]]
  from = "/api/run-seo-audit"
  to = "/.netlify/functions/run-seo-audit"
  status = 200

[[redirects]]
  from = "/api/find-leads"
  to = "/.netlify/functions/find-leads"
  status = 200

[[redirects]]
  from = "/api/import-leads"
  to = "/.netlify/functions/import-leads"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
