services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: misthustlers:latest
    container_name: misthustlers-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      TRUST_PROXY: "1"
      UPLOAD_DIR: uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - misthustlers_uploads:/app/backend/uploads
      - misthustlers_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  misthustlers_uploads:
  misthustlers_data:
